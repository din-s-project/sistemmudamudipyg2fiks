<style>
:root{color-scheme:light;--bg:#eef2f8;--cd:#fff;--tx:#121c2e;--mu:#5a6a82;--bd:#dbe3ef;--hv:#f2f5fa;--pr:#1f3a6e;--pt:#fff;--H:#1b9a68;--I:#2f7bbf;--S:#d58a1f;--dg:#c0392b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0b1322;--cd:#131f35;--tx:#e6ecf7;--mu:#93a3bf;--bd:#243553;--hv:#1a2a45;--pr:#8db0ee;--pt:#0a1a33;--H:#34c38b;--I:#6fb2ef;--S:#f0b35c;--dg:#ef7b6e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:52px;height:52px;border-radius:50%;object-fit:cover}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:800}.sub{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px}
.tg{font-weight:800;font-size:17px}.fl{display:grid;gap:14px;margin-top:14px}
label.t{display:grid;gap:6px;font-weight:700;font-size:14px}
select,input[type=text],textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;width:100%}
textarea{min-height:90px;resize:vertical}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:14px 6px;border:2px solid var(--bd);border-radius:12px;font-weight:800;background:var(--cd)}
.opt input:checked+span{color:#fff}.opt.H input:checked+span{background:var(--H);border-color:var(--H)}.opt.I input:checked+span{background:var(--I);border-color:var(--I)}.opt.S input:checked+span{background:var(--S);border-color:var(--S)}
.opt input:focus-visible+span{outline:2px solid var(--pr);outline-offset:2px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;background:var(--pr);color:var(--pt);cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}.btn.o{background:var(--hv);color:var(--tx);border:1px solid var(--bd)}
.er{color:var(--dg);font-weight:700;font-size:14px;min-height:20px}.msg{text-align:center;padding:20px 8px}.msg b{font-size:18px}
.ok{color:var(--H);font-size:44px;line-height:1}.hint{font-size:12.5px;color:var(--mu)}
.o2{grid-template-columns:1fr 1fr}.fl.in{margin:0}
</style>

 app(`${kop}<div class="fl">

  <div><div class="t" style="font-weight:700;font-size:14px;margin-bottom:6px">Kehadiran</div><div class="opts">${['H','I','S'].map(c=>`<label class="opt ${c}"><input type="radio" name="st" value="${c}"><span>${LB[c]}</span></label>`).join('')}</div></div>
  <label class="t" id="alw" hidden>Alasan <span class="hint" id="alh">(wajib diisi)</span><textarea id="al" maxlength="300" placeholder="Contoh: sedang demam / ada acara keluarga"></textarea></label>
  ${i.butuh_kode?'<label class="t">Kode pertemuan<input type="text" id="kd" autocomplete="off" placeholder="Tanyakan ke pengurus"></label>':''}
  <div class="er" id="er"></div>
  <button class="btn" id="kirim">Kirim absen</button>
  <div class="hint">Absen hanya bisa diisi satu kali. Jika salah, hubungi pengurus untuk mengubahnya.</div>
 </div>`);
 document.querySelectorAll('input[name=st]').forEach(r=>r.onchange=()=>{const v=document.querySelector('input[name=st]:checked').value;$('#alw').hidden=v==='H'});
 $('#kirim').onclick=kirim
}
async function kirim(){
 const id=$('#nm').value,r=document.querySelector('input[name=st]:checked'),al=$('#al').value.trim(),kd=$('#kd')?$('#kd').value.trim():'',er=$('#er');
 if(!id){er.textContent='Pilih nama kamu dulu.';return}
 if(!r){er.textContent='Pilih Hadir, Izin, atau Sakit.';return}
 if(r.value!=='H'&&al.length<3){er.textContent='Mohon isi alasan '+LB[r.value].toLowerCase()+'.';return}
 if(info.butuh_kode&&!kd){er.textContent='Isi kode pertemuan.';return}
 er.textContent='';const b=$('#kirim');b.disabled=true;b.textContent='Mengirim...';
 try{
  const x=await sb.rpc('absen_kirim',{p_member:id,p_status:r.value,p_alasan:al,p_kode:kd});if(x.error)throw x.error;
  if(!x.data.ok){er.textContent=x.data.pesan;b.disabled=false;b.textContent='Kirim absen';if(/sudah/i.test(x.data.pesan))setTimeout(muat,2500);return}
  const nama=$('#nm').selectedOptions[0].textContent;
  app(`<div class="msg"><div class="ok">&#10003;</div><p><b>Terima kasih, ${esc(nama)}</b></p><p>Kehadiran tercatat: <b>${LB[r.value]}</b></p><button class="btn o" id="lagi">Isi untuk orang lain</button></div>`);$('#lagi').onclick=muat
 }catch(e){er.textContent='Gagal mengirim: '+(e.message||'coba lagi');b.disabled=false;b.textContent='Kirim absen'}
}
const JN={pengganti:'Pengganti pengajian Selasa',khusus:'Pengajian khusus',kegiatan:'Kegiatan',ramah_tamah:'Ramah tamah',gabungan:'Pengajian gabungan',lainnya:'Kegiatan'};
function tampilK(){
 const i=info;
 if(i.status==='tidak_ada'){app('<div class="msg"><b>Kegiatan tidak ditemukan</b><p class="hint">Periksa kembali tautan dari pengurus.</p></div>');return}
 const kop=`<div class="tg">${esc(i.nama)}</div><div class="sub">${JN[i.jenis]||'Kegiatan'} · ${tgl(i.tgl)}${i.tgl_selesai&&i.tgl_selesai>i.tgl?' s.d. '+tgl(i.tgl_selesai):''}${i.lokasi?' · '+esc(i.lokasi):''}</div>${i.catatan?`<div class="sub">${esc(i.catatan)}</div>`:''}`;
 if(i.status==='belum'){app(`${kop}<div class="msg"><b>Absen belum dimulai</b><p class="hint">Absen bisa diisi mulai tanggal kegiatan.</p><button class="btn o" id="ulang">Muat ulang</button></div>`);$('#ulang').onclick=muat;return}
 if(i.status!=='buka'){app(`${kop}<div class="msg"><b>Absen belum dibuka</b><p class="hint">Absen dibuka oleh pengurus saat kegiatan berlangsung. Silakan coba lagi nanti atau hubungi pengurus.</p><button class="btn o" id="ulang">Muat ulang</button></div>`);$('#ulang').onclick=muat;return}
 const G=i.gabungan,grp=['PR','RM','UN'].map(k=>{const l=i.anggota.filter(x=>x.kelompok===k);return l.length?`<optgroup label="${GN[k]}">${l.map(x=>`<option value="${esc(x.id)}"${x.sudah?' disabled':''}>${esc(x.nama)}${x.sudah?' (sudah absen)':''}</option>`).join('')}</optgroup>`:''}).join('');
 app(`${kop}<div class="fl">
  ${G?`<div class="opts o2"><label class="opt H"><input type="radio" name="tp" value="a" checked><span>Anggota kelompok ini</span></label><label class="opt I"><input type="radio" name="tp" value="t"><span>Dari kelompok / desa lain</span></label></div>`:''}
  <label class="t" id="wn">Nama kamu<select id="nm"><option value="">Pilih nama</option>${grp}</select></label>
  ${G?`<div id="wt" class="fl in" hidden><label class="t">Nama lengkap<input type="text" id="tn" maxlength="80" autocomplete="off"></label><label class="t">Asal kelompok / desa<input type="text" id="ta" maxlength="80" autocomplete="off" placeholder="Contoh: Kelompok Cipondoh, Desa Sukamaju"></label></div>`:''}
  <div><div class="t" style="font-weight:700;font-size:14px;margin-bottom:6px">Kehadiran</div><div class="opts">${['H','I','S'].map(c=>`<label class="opt ${c}"><input type="radio" name="st" value="${c}"><span>${LB[c]}</span></label>`).join('')}</div></div>
  <label class="t" id="alw" hidden>Alasan <span class="hint">(wajib diisi)</span><textarea id="al" maxlength="300" placeholder="Contoh: sedang demam / ada acara keluarga"></textarea></label>
  ${i.butuh_kode?'<label class="t">Kode kegiatan<input type="text" id="kd" autocomplete="off" placeholder="Tanyakan ke pengurus"></label>':''}
  <div class="er" id="er"></div>
  <button class="btn" id="kirim">Kirim absen</button>
  <div class="hint">Absen hanya bisa diisi satu kali. Jika salah, hubungi pengurus untuk mengubahnya.</div>
 </div>`);
 document.querySelectorAll('input[name=st]').forEach(r=>r.onchange=()=>{$('#alw').hidden=document.querySelector('input[name=st]:checked').value==='H'});
 document.querySelectorAll('input[name=tp]').forEach(r=>r.onchange=()=>{const tm=document.querySelector('input[name=tp]:checked').value==='t';$('#wt').hidden=!tm;$('#wn').hidden=tm});
 $('#kirim').onclick=kirimK
}
async function kirimK(){
 const G=info.gabungan,tm=G&&document.querySelector('input[name=tp]:checked').value==='t',r=document.querySelector('input[name=st]:checked'),al=$('#al').value.trim(),kd=$('#kd')?$('#kd').value.trim():'',er=$('#er');
 const id=$('#nm').value,tn=tm?$('#tn').value.trim().replace(/\s+/g,' '):'',ta=tm?$('#ta').value.trim().replace(/\s+/g,' '):'';
 if(tm){if(tn.length<2){er.textContent='Isi nama lengkap kamu.';return}if(ta.length<2){er.textContent='Isi asal kelompok atau desa.';return}}else if(!id){er.textContent='Pilih nama kamu dulu.';return}
 if(!r){er.textContent='Pilih Hadir, Izin, atau Sakit.';return}
 if(r.value!=='H'&&al.length<3){er.textContent='Mohon isi alasan '+LB[r.value].toLowerCase()+'.';return}
 if(info.butuh_kode&&!kd){er.textContent='Isi kode kegiatan.';return}
 er.textContent='';const b=$('#kirim');b.disabled=true;b.textContent='Mengirim...';
 try{
  const x=tm?await sb.rpc('absen_kegiatan_tamu',{p_event:KID,p_nama:tn,p_asal:ta,p_status:r.value,p_alasan:al,p_kode:kd}):await sb.rpc('absen_kegiatan_kirim',{p_event:KID,p_member:id,p_status:r.value,p_alasan:al,p_kode:kd});
  if(x.error)throw x.error;
  if(!x.data.ok){er.textContent=x.data.pesan;b.disabled=false;b.textContent='Kirim absen';if(/sudah/i.test(x.data.pesan)&&!tm)setTimeout(muat,2500);return}
  const nama=tm?tn+' ('+ta+')':$('#nm').selectedOptions[0].textContent;
  app(`<div class="msg"><div class="ok">&#10003;</div><p><b>Terima kasih, ${esc(nama)}</b></p><p>Kehadiran tercatat: <b>${LB[r.value]}</b></p><button class="btn o" id="lagi">Isi untuk orang lain</button></div>`);$('#lagi').onclick=muat
 }catch(e){er.textContent='Gagal mengirim: '+(e.message||'coba lagi');b.disabled=false;b.textContent='Kirim absen'}
}
muat();
</script>
</body>
